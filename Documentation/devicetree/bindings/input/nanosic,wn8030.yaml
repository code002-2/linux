%YAML 1.2
---
$id: http://devicetree.org/schemas/input/nanosic,wn8030.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nanosic WN8030 keyboard cover MCU

maintainers:
  - bluseliu50 <bluseliu50@gmail.com>

description:
  The WN8030 is an I2C-attached microcontroller that bridges a detachable
  keyboard cover (keyboard, touchpad and their LEDs) to the host over pogo
  pins. It boots from RAM, so the host downloads its firmware through the
  MCU bootloader every time the MCU is powered up or reset. The keyboard
  and touchpad are then exposed as HID devices. The board variant selects
  the report descriptors, the command register and the power-up timing.

properties:
  compatible:
    enum:
      - nanosic,wn8030-piano
      - nanosic,wn8030-sheng

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Data-ready line, rising edge.

  reset-gpios:
    maxItems: 1

  sleep-gpios:
    maxItems: 1
    description: Keeps the MCU awake while deasserted.

  status-gpios:
    maxItems: 1
    description: Cover attach status reported by the MCU.

  vddio-supply:
    description: 1.8 V I/O and I2C pull-up supply.

  dvdd-supply:
    description: 3.3 V MCU supply. It is switched on only after vddio.

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - sleep-gpios
  - status-gpios
  - vddio-supply
  - dvdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        keyboard@4c {
            compatible = "nanosic,wn8030-piano";
            reg = <0x4c>;
            interrupts-extended = <&tlmm 97 IRQ_TYPE_EDGE_RISING>;
            reset-gpios = <&tlmm 188 GPIO_ACTIVE_LOW>;
            sleep-gpios = <&tlmm 3 GPIO_ACTIVE_LOW>;
            status-gpios = <&tlmm 95 GPIO_ACTIVE_HIGH>;
            vddio-supply = <&vreg_l11b_1p8>;
            dvdd-supply = <&vreg_l14b_3p3>;
        };
    };
...
